worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { application/wasm wasm; text/javascript js mjs; }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;

    gzip_static on;
    gzip on;
    gzip_types application/wasm text/javascript text/css application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\. { deny all; }

        # Content-hashed asset names (trunk output, e.g. app-web-0123456789abcdef_bg.wasm):
        # cache forever. Everything else, including unhashed names some apps ship
        # (lightcraft_web_bg.wasm), must revalidate so upgrades take effect.
        location ~* "-[0-9a-f]{16}(_bg)?\.(wasm|js)$" {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
